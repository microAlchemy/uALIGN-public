kind: circuit
pdk: FinFET14nm_Mock_PDK
tier: exhaustive
timeout_s: 1200
flow:
  nvariants: 1
  seed: 1
cases:
- id: high_speed_comparator
  subckt: high_speed_comparator
  netlist: '.subckt high_speed_comparator clk vcc vin vip von vop vss

    mn0 vcom clk vss vss n nfin=6 nf=2 l=14e-9 m=8

    mn1 vin_d vin vcom vss n nfin=6 nf=2 l=14e-9 m=16

    mn2 vip_d vip vcom vss n nfin=6 nf=2 l=14e-9 m=16

    mn3 vin_o vip_o vin_d vss n nfin=6 nf=2 l=14e-9 m=8

    mn4 vip_o vin_o vip_d vss n nfin=6 nf=2 l=14e-9 m=8

    mp5 vin_o vip_o vcc vcc p nfin=6 nf=2 l=14e-9 m=4

    mp6 vip_o vin_o vcc vcc p nfin=6 nf=2 l=14e-9 m=4

    mp7 vin_d clk vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mp8 vip_d clk vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mp9 vin_o clk vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mp10 vip_o clk vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mp11 vop vip_o vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mn13 vop vip_o vss vss n nfin=6 nf=2 l=14e-9 m=1

    mp12 von vin_o vcc vcc p nfin=6 nf=2 l=14e-9 m=1

    mn14 von vin_o vss vss n nfin=6 nf=2 l=14e-9 m=1

    .ends high_speed_comparator'
  constraints:
    HIGH_SPEED_COMPARATOR:
    - constraint: PowerPorts
      ports:
      - VCC
    - constraint: GroundPorts
      ports:
      - VSS
    - constraint: ClockPorts
      ports:
      - clk
    - constraint: HorizontalDistance
      abs_distance: 0
    - constraint: VerticalDistance
      abs_distance: 0
    - constraint: GroupBlocks
      instances:
      - mn1
      - mn2
      instance_name: xdp
    - constraint: GroupBlocks
      instances:
      - mn3
      - mn4
      instance_name: xccn
    - constraint: GroupBlocks
      instances:
      - mp5
      - mp6
      instance_name: xccp
    - constraint: GroupBlocks
      instances:
      - mp11
      - mn13
      instance_name: xinv_n
    - constraint: GroupBlocks
      instances:
      - mp12
      - mn14
      instance_name: xinv_p
    - constraint: SymmetricBlocks
      direction: V
      pairs:
      - - mn0
      - - xdp
      - - xccn
      - - xccp
      - - mp7
        - mp8
      - - mp9
        - mp10
      - - xinv_n
        - xinv_p
    - constraint: Order
      direction: top_to_bottom
      instances:
      - mn0
      - xdp
      - xccn
      - xccp
    - constraint: Align
      line: h_bottom
      instances:
      - mp9
      - mp7
      - xdp
      - mp8
      - mp10
    - constraint: Align
      line: h_bottom
      instances:
      - xinv_n
      - xccp
      - xinv_p
    - constraint: SymmetricNets
      direction: V
      net1: vin
      pins1:
      - mn1/G
      net2: vip
      pins2:
      - mn2/G
    - constraint: SymmetricNets
      direction: V
      net1: vin_d
      pins1:
      - mn1/D
      - mn3/S
      - mp7/D
      net2: vip_d
      pins2:
      - mn2/D
      - mn4/S
      - mp8/D
    - constraint: SymmetricNets
      direction: V
      net1: vin_o
      pins1:
      - mn3/D
      - mn4/G
      - mp5/D
      - mp6/G
      - mp9/D
      - mp12/G
      - mn14/G
      net2: vip_o
      pins2:
      - mn3/G
      - mn4/D
      - mp5/G
      - mp6/D
      - mp10/D
      - mp11/G
      - mn13/G
