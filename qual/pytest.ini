; Config for the qualification suite only.
;
; Because this file exists, `pytest qual` uses it as its rootdir config
; instead of the ALIGN pytest.ini one level up, and ALIGN's root conftest.py
; is not loaded. The two suites stay independent: a bare `pytest` from the
; repo root still runs only ALIGN's own tests (testpaths = tests).
;
; The junitxml path assumes the documented invocation, from the repo root:
;   cd $ALIGN_HOME && pytest qual

[pytest]
addopts = --junitxml=qual/artifacts/junit.xml
junit_family = xunit2
; Tier names are deliberately distinct from ALIGN's own markers
; (nightly, regression) so neither name is ever ambiguous.
markers =
    quick: fast subset, runs on every commit
    standard: structural and small-circuit set, runs nightly
    exhaustive: complete primitive sweeps, runs weekly
    primitive: device-level cases
    structure: analog structure cases
    circuit: small-circuit cases
    requires_drc: needs an external DRC tool on PATH
    requires_lvs: needs an external LVS tool on PATH
